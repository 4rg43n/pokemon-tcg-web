<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Pokémon TCG Playmat</title><link rel="stylesheet" href="style.css?v=28"></head><body><section id="main-menu" aria-labelledby="menu-title"><div class="menu-panel"><p class="builder-eyebrow">TWO PLAYERS · ONE PLAYMAT</p><h1 id="menu-title">Pokémon TCG <small>v30</small></h1><p class="menu-intro">Build your deck. Find your strategy. Play together.</p><nav class="menu-options" aria-label="Main menu"><button id="menu-play" type="button" disabled><strong>Play</strong><span>Open the two-player playmat</span></button><button id="menu-decks" type="button" disabled><strong>Deck Builder</strong><span>Create and save a deck for each player</span></button></nav><p class="builder-note" id="menu-message" role="status">Loading game…</p><p class="builder-note">Educational prototype · Card data and rules are incomplete.</p></div></section><main hidden><header><h1>Pokémon TCG <small style="font-size:.48em;vertical-align:middle;opacity:.7">v30</small></h1><p id="status"></p></header><div id="board"><p id="loading">Loading playmat…</p></div><div id="actions"><button id="open-menu" type="button">Main Menu</button><button id="open-decks" type="button">Build Decks</button><button id="ai-toggle" type="button">AI Player 2: OFF</button><button data-action="ready" hidden>Ready</button><button data-action="retreat" hidden>Retreat (1 Energy)</button><button data-action="trainer" hidden>Play Trainer</button><button data-action="attack">Attack</button><button data-action="end">End Turn</button><button data-action="reset">New Game</button></div><p id="error" role="status"></p><details><summary>AI planning debug</summary><pre id="ai-plans" style="white-space:pre-wrap;overflow-wrap:anywhere;max-height:400px;overflow:auto"></pre><button id="ai-export" type="button">Export plans JSON</button></details><details><summary>Game log</summary><ol id="log"></ol></details></main><section id="deck-builder" hidden aria-label="Deck builder"></section><div id="modal" hidden><div class="modal-panel"><button class="close-modal" aria-label="Close">✕</button><div class="modal-content"></div></div></div><script>window.addEventListener("error",e=>{const el=document.getElementById("loading");if(el)el.textContent="Game failed to load: "+e.message;document.getElementById("menu-message").textContent="Game failed to load: "+e.message;});window.addEventListener("unhandledrejection",e=>{const el=document.getElementById("loading");if(el)el.textContent="Game failed to load: "+e.reason;document.getElementById("menu-message").textContent="Game failed to load: "+e.reason;});</script><script type="module" src="src/main.js?v=29"></script></body></html>
