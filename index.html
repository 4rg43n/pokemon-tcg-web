<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Pokémon TCG Playmat</title><link rel="stylesheet" href="style.css?v=7"></head><body><main><header><h1>Pokémon TCG</h1><p id="status"></p></header><div id="board"><p id="loading">Loading playmat…</p></div><div id="actions"><button data-action="ready" hidden>Ready</button><button data-action="retreat" hidden>Retreat (1 Energy)</button><button data-action="attack">Attack</button><button data-action="end">End Turn</button><button data-action="reset">New Game</button></div><p id="error" role="status"></p><details><summary>Game log</summary><ol id="log"></ol></details></main><div id="modal" hidden><div class="modal-panel"><button class="close-modal" aria-label="Close">✕</button><div class="modal-content"></div></div></div><script>window.addEventListener("error",e=>{const el=document.getElementById("loading");if(el)el.textContent="Game failed to load: "+e.message;});window.addEventListener("unhandledrejection",e=>{const el=document.getElementById("loading");if(el)el.textContent="Game failed to load: "+e.reason;});</script><script type="module" src="src/main.js?v=7"></script></body></html>
